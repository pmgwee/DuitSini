<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="DuitSini logo">
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#5B3FD6"/>
    </linearGradient>
  </defs>
  <!-- Squircle (120x120, matches Google's recommended logo size). -->
  <rect x="0" y="0" width="120" height="120" rx="28" ry="28" fill="url(#ds-bg)"/>
  <!-- "D" monogram in white. -->
  <text x="60" y="62" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800"
        fill="#FFFFFF" letter-spacing="-2">D</text>
  <!-- Three ascending dots: a nod to the three money surfaces (bills / AI / market). -->
  <circle cx="40" cy="92" r="4.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="56" cy="92" r="4.5" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="72" cy="92" r="4.5" fill="#FFFFFF"/>
</svg>
